<!doctype html>

    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: treść wchodzi pod notch, safe-area obsługujemy w CSS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Przepisy</title>
    <style>
      html, body { background: #f2f2f7 }
      @media (prefers-color-scheme: dark) { html, body { background: #1d1e24 } }
    </style>
    <!-- iPhone z ekranu głównego: system bywa krótszy niż ekran (pas gestu), więc pierwszy render liczyłby środek niżej
         niż statyczny obraz startowy i logo „podskakiwałoby”. Ten sam wzór co computeLayout (src/lib/viewport.ts), zanim
         ruszy aplikacja; tests/viewport.test.ts pilnuje zgodności. -->
    <script id="boot-layout">
      (function () {
        var n = navigator
        var standalone = n.standalone === true || matchMedia('(display-mode: standalone)').matches
        if (!standalone || !/iPhone|iPod/.test(n.userAgent)) return
        var tall = Math.max(screen.width, screen.height)
        var short = Math.min(screen.width, screen.height)
        var h = Math.max(innerWidth > innerHeight ? short : tall, innerHeight)
        var root = document.documentElement
        root.style.setProperty('--app-height', h + 'px')
        root.classList.add('fit-screen')
      })()
    </script>
    <meta name="description" content="Twoja kolekcja przepisów kulinarnych" />

    <!-- iOS: tryb pełnoekranowy po dodaniu do ekranu początkowego -->
